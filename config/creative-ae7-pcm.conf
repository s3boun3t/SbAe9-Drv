# Install in /etc/alsa/conf.d/. SD4 carries six slots at 48 kHz.
# ALSA's route plugin writes silence to the four unmapped slots.
pcm.ae7_headphones {
	@args [ CARD ]
	@args.CARD {
		type string
		default "AE7"
	}
	type route
	slave {
		pcm {
			type hw
			card $CARD
			device 0
		}
		format S32_LE
		channels 6
	}
	ttable.0.0 1
	ttable.1.1 1
}
