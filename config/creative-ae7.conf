# SPDX-License-Identifier: GPL-2.0-or-later
# Install in /usr/share/alsa-card-profile/mixer/profile-sets/.
# With no mixer path, PipeWire applies the volume in software.
[General]
auto-profiles = no

[Mapping analog-stereo-headphones]
description = Headphones
device-strings = ae7_headphones:%f
channel-map = left,right
exact-channels = yes
direction = output

[Profile output:analog-stereo-headphones]
description = Headphones
output-mappings = analog-stereo-headphones
priority = 6500
